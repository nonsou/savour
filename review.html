<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reviewer access</title>
<style>
:root{--bg:#fff;--bg2:#f7f7f5;--text:#1a1a1a;--text2:#555;--text3:#999;--border:rgba(0,0,0,0.1);--border2:rgba(0,0,0,0.18);--blue:#1a5fd4;--blue-bg:#e8f0fd;--blue-text:#1a4ba8;--green:#166534;--green-bg:#dcfce7;--green-text:#14532d;--amber-bg:#fef3c7;--amber-text:#78350f;--red-bg:#fee2e2;--red-text:#991b1b;--r:10px;--rs:6px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg2);color:var(--text);min-height:100vh}
.page{max-width:1080px;margin:0 auto;padding:1.5rem 1rem 4rem}
.hdr{text-align:center;margin-bottom:2rem;padding:1.5rem;background:var(--bg);border-radius:var(--r);border:0.5px solid var(--border)}
.hdr h1{font-size:22px;font-weight:700}
.hdr p{font-size:13px;color:var(--text2);margin-top:4px}
.card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--r);padding:1.25rem 1.5rem;margin-bottom:1.25rem}
.card-t{font-size:14px;font-weight:600;margin-bottom:1rem;padding-bottom:8px;border-bottom:0.5px solid var(--border)}
.field{margin-bottom:.9rem}.field:last-child{margin-bottom:0}
.lbl{display:block;font-size:11px;font-weight:600;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em}
input[type=text],input[type=tel],input[type=number],input[type=password],input[type=date],#rev-name{width:100%;padding:8px 10px;border:0.5px solid var(--border2);border-radius:var(--rs);font-size:14px;color:var(--text);background:var(--bg);font-family:inherit}
#rev-name{appearance:auto}
#rev-name:disabled{background:var(--bg2,#f5f5f5);color:var(--text2);cursor:not-allowed}
input:focus{outline:none;border-color:var(--blue)}
.btn{padding:9px 18px;border:0.5px solid var(--border2);border-radius:var(--rs);font-size:14px;cursor:pointer;background:transparent;color:var(--text);font-family:inherit}
.btn:hover{background:var(--bg2)}
.btn.pri{background:var(--blue);color:#fff;border-color:transparent;font-weight:500}
.btn.pri:hover{background:#1550b8}
.btn.full{width:100%;padding:12px;font-size:15px;font-weight:500}
.btn.sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.msg{padding:10px 14px;border-radius:var(--rs);font-size:13px;margin-top:10px;display:none}
.msg.green{background:var(--green-bg);color:var(--green-text);display:block}
.msg.red{background:var(--red-bg);color:var(--red-text);display:block}
.msg.amber{background:var(--amber-bg);color:var(--amber-text);display:block}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.help{font-style:italic;color:var(--text2);font-size:12px;margin-top:14px;text-align:center}

.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.badge.grey{background:var(--bg2);color:var(--text2);border:0.5px solid var(--border)}
.badge.green{background:var(--green-bg);color:var(--green-text);border:0.5px solid transparent}

.approval-line{font-size:12px;color:var(--green-text);margin-top:4px;font-weight:500}
.approval-line:empty{display:none}

/* ── Reviewer header bar ── */
.review-hdr{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem 1.25rem;background:var(--bg);border:0.5px solid var(--border);border-radius:var(--r);margin-bottom:1.25rem;flex-wrap:wrap}
.rh-left h2{font-size:16px;font-weight:700;margin-bottom:2px}
.rh-left p{font-size:12px;color:var(--text2)}
.rh-right{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.rh-right .who{font-size:13px;color:var(--text2)}
.rh-right .who strong{color:var(--text);font-weight:600}

/* ── Report (lifted from admin.html, do not edit) ── */
.rtable{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.rtable th{background:var(--bg2);text-align:left;padding:7px 10px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--text2);border:0.5px solid var(--border)}
.rtable td{padding:8px 10px;border:0.5px solid var(--border);vertical-align:top}
.rtable tr:nth-child(even) td{background:var(--bg2)}
.rcell-mute{color:var(--text3)}
.report-warn{background:var(--amber-bg);color:var(--amber-text);border-radius:var(--rs);padding:9px 13px;font-size:12px;margin:0 0 12px}
.sguide{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--r);padding:1rem 1.25rem;margin-bottom:1.5rem}
.sguide-t{font-size:11px;font-weight:600;color:var(--text2);margin-bottom:10px;text-transform:uppercase;letter-spacing:.05em}
.sguide-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.sguide-item{padding:10px 12px;border-radius:var(--rs);font-size:13px;line-height:1.35}
.sguide-item b{font-weight:700;margin-right:6px}
.sguide-1{background:var(--red-bg);color:var(--red-text)}
.sguide-2{background:#fed7aa;color:var(--amber-text)}
.sguide-3{background:var(--amber-bg);color:var(--amber-text)}
.sguide-4{background:var(--green-bg);color:var(--green-text)}
.sguide-5{background:#bbf7d0;color:var(--green-text)}
@media(max-width:480px){.sguide-grid{grid-template-columns:1fr}}

.loading-state{text-align:center;padding:2.5rem;color:var(--text3);font-size:14px}
.err-overlay{text-align:center;padding:2.5rem 1rem}
.err-overlay h3{font-size:16px;font-weight:700;margin-bottom:6px}
.err-overlay p{font-size:13px;color:var(--text2);margin-bottom:14px;max-width:380px;margin-left:auto;margin-right:auto}

.login-card{max-width:420px;margin:0 auto}

/* ── R3b inline edit controls ── */
.rtable td .cell-edit{width:100%;padding:4px 6px;border:0.5px solid transparent;border-radius:4px;font-size:13px;font-family:inherit;background:transparent;color:var(--text)}
.rtable td .cell-edit:hover{border-color:var(--border)}
.rtable td .cell-edit:focus{outline:none;border-color:var(--blue);background:#fff}
.rtable td select.cell-edit{cursor:pointer}
.rtable td .radio-grp{display:flex;gap:10px;font-size:12px;color:var(--text2)}
.rtable td .radio-grp label{display:inline-flex;align-items:center;gap:3px;cursor:pointer}
.rtable td .radio-grp input{margin:0}
.btn-rm{padding:4px 9px;font-size:12px;border:0.5px solid var(--border2);background:transparent;border-radius:4px;cursor:pointer;color:var(--red-text)}
.btn-rm:hover{background:var(--red-bg)}
.action-add{margin-top:8px;text-align:left}
.action-add .btn{font-size:13px}

/* ── R3b toasts ── */
.toast{position:fixed;bottom:20px;right:20px;padding:10px 16px;border-radius:var(--rs);font-size:13px;font-weight:500;box-shadow:0 2px 8px rgba(0,0,0,.15);z-index:1000;animation:toastIn .2s ease-out}
.toast.green{background:var(--green-bg);color:var(--green-text)}
.toast.red{background:var(--red-bg);color:var(--red-text)}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ── R5 Approve panel ── */
.approve-card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--r);padding:1.5rem;margin-bottom:1.25rem;text-align:center}
.approve-help{font-size:13px;color:var(--text2);margin-bottom:14px;font-style:italic}
.approve-card .btn.full{max-width:380px;margin:0 auto;display:block}
.approved-block{font-size:14px;color:var(--green-text);background:var(--green-bg);padding:14px 18px;border-radius:var(--rs);font-weight:500}
.report-approval-stamp{display:flex;align-items:center;gap:10px;background:var(--green-bg);color:var(--green-text);border:0.5px solid var(--green);border-radius:var(--rs);padding:10px 14px;margin:0 0 14px;font-size:13px;font-weight:500;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.report-approval-stamp .approval-badge{display:inline-block;background:var(--green);color:#fff;padding:2px 8px;border-radius:3px;font-size:11px;font-weight:700;letter-spacing:.04em;white-space:nowrap;-webkit-print-color-adjust:exact;print-color-adjust:exact}
@media print{.review-hdr,.approve-card,.toast,.btn{display:none!important}.page{padding:0}.rcell-mute{color:#999!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}.report-approval-stamp{break-inside:avoid;-webkit-print-color-adjust:exact;print-color-adjust:exact}.report-approval-stamp .approval-badge{-webkit-print-color-adjust:exact;print-color-adjust:exact}}

/* ── Mobile-only DOM hidden on desktop ── */
.sec3-mobile{display:none}
.m-card-hdr{display:none}

/* ── R7 Mobile UX (≤640px) ── */
@media (max-width:640px){
  body{font-size:16px;line-height:1.5}
  .page{padding:1rem .75rem;padding-bottom:max(5rem,calc(3rem + env(safe-area-inset-bottom)))}
  .hdr{padding:1.25rem 1rem;margin-bottom:1.25rem}
  .hdr h1{font-size:24px}
  .hdr p{font-size:14px}
  .card{padding:1rem .9rem}
  .card-t{font-size:18px;padding-bottom:10px;margin-bottom:14px}
  .lbl{font-size:12px}

  /* Inputs: 16px+ font prevents iOS zoom-on-focus; 44px min-height for tap */
  input[type=text],input[type=tel],input[type=number],input[type=password],input[type=date],select,#rev-name{
    font-size:16px;min-height:44px;padding:11px 12px
  }
  .btn{min-height:44px;padding:11px 18px;font-size:15px}
  .btn.full{padding:14px;font-size:16px}
  .btn.sm{min-height:44px;padding:10px 14px;font-size:15px}

  /* Login screen */
  .login-card{max-width:none;padding:1.25rem 1rem}
  .login-card .field{margin-bottom:1rem}

  /* Header bar — stack vertically */
  .review-hdr{flex-direction:column;align-items:stretch;gap:10px;padding:1rem}
  .rh-left h2{font-size:18px}
  .rh-left p{font-size:13px}
  .rh-right{justify-content:space-between;gap:10px}
  .rh-right .who{font-size:14px}

  .sguide{padding:.9rem 1rem}
  .sguide-grid{grid-template-columns:1fr}
  .sguide-item{font-size:14px}

  /* Section 3 — swap desktop table for mobile cards */
  .sec3-desktop{display:none}
  .sec3-mobile{display:block}
  .m-vcard{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--rs);padding:14px 14px;margin-bottom:12px}
  .m-vcard.m-avg{background:var(--blue-bg);border-left:3px solid var(--blue)}
  .m-vhead{margin-bottom:10px}
  .m-vname{font-size:17px;font-weight:700;line-height:1.3;color:var(--text)}
  .m-vsub{font-size:13px;color:var(--text2);margin-top:2px}
  .m-vmeta{display:flex;flex-wrap:wrap;gap:14px;font-size:14px;color:var(--text);padding-bottom:10px;margin-bottom:10px;border-bottom:0.5px solid var(--border)}
  .m-vmeta .m-mlbl{color:var(--text3);font-weight:500}
  .m-vmeta strong{color:var(--text);font-weight:600}
  .m-rows{display:flex;flex-direction:column;gap:6px}
  .m-row{display:flex;align-items:center;gap:12px;min-height:44px}
  .m-lbl{flex:0 0 40%;font-size:15px;font-weight:500;color:var(--text)}
  .m-val{flex:1 1 60%;min-width:90px;display:flex;justify-content:flex-end;align-items:center}
  .m-val select.cell-edit{width:100%;font-size:16px;min-height:44px;padding:8px 12px;border:0.5px solid var(--border2);border-radius:var(--rs);background:var(--bg);color:var(--text);font-family:inherit;cursor:pointer}
  .m-val select.cell-edit:focus{outline:none;border-color:var(--blue)}
  .m-val strong{font-size:16px;color:var(--text)}
  .m-vcard.m-avg .m-rows .m-row{min-height:36px}
  .m-vtot{margin-top:14px;padding-top:12px;border-top:0.5px solid var(--border);font-size:16px;display:flex;justify-content:space-between;align-items:center}
  .m-vtot span{color:var(--text2);font-weight:500}
  .m-vtot strong{font-weight:700;color:var(--text);font-size:17px}

  /* Sections 1/4/5/6 — responsive table → cards */
  .rtable-resp{font-size:15px}
  .rtable-resp,
  .rtable-resp thead,
  .rtable-resp tbody,
  .rtable-resp tr,
  .rtable-resp td{display:block;width:100%}
  .rtable-resp thead{display:none}
  .rtable-resp tr{border:0.5px solid var(--border);border-radius:var(--rs);background:var(--bg);padding:12px 14px;margin-bottom:12px}
  .rtable-resp tr:nth-child(even) td{background:transparent}
  .rtable-resp td{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border:none;border-bottom:0.5px solid var(--border);font-size:15px;line-height:1.4;min-height:44px;word-break:break-word}
  .rtable-resp td:last-child{border-bottom:none}
  .rtable-resp td::before{content:attr(data-label);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--text2);flex-shrink:0;max-width:45%}
  /* Cells with text/date inputs stack label above full-width value */
  .rtable-resp td:has(input[type=text]),
  .rtable-resp td:has(input[type=date]){flex-direction:column;align-items:stretch;gap:6px}
  .rtable-resp td:has(input[type=text])::before,
  .rtable-resp td:has(input[type=date])::before{max-width:none}
  /* Bigger, full-width edit controls inside the responsive table */
  .rtable-resp td .cell-edit{font-size:16px;min-height:44px;padding:10px 12px;border:0.5px solid var(--border2);background:var(--bg)}
  .rtable-resp td .cell-edit:focus{outline:none;border-color:var(--blue);background:var(--bg)}
  /* Radio groups: wrap, larger tap targets */
  .rtable-resp td:has(.radio-grp){flex-wrap:wrap}
  .rtable-resp td .radio-grp{flex-wrap:wrap;gap:14px;font-size:15px;color:var(--text);justify-content:flex-end}
  .rtable-resp td .radio-grp label{padding:8px 4px;min-height:44px;gap:6px}
  .rtable-resp td .radio-grp input[type=radio]{width:18px;height:18px;margin:0}
  /* Mobile-only card header (Section 5) */
  .rtable-resp td.m-card-hdr{display:block;font-size:17px;font-weight:700;color:var(--text);padding:0 0 12px;margin-bottom:8px;border-bottom:0.5px solid var(--border);min-height:0;line-height:1.3}
  .rtable-resp td.m-card-hdr::before{display:none}
  /* Hide cells we don't want on mobile (e.g. Section 5 # column) */
  .rtable-resp td.m-hide{display:none}
  /* Section 5 Remove button — full-width destructive at bottom of card */
  .rtable-resp td.m-action-rm{display:block;border-bottom:none;padding:12px 0 0;margin-top:8px;border-top:0.5px solid var(--border)}
  .rtable-resp td.m-action-rm::before{display:none}
  .rtable-resp td.m-action-rm .btn-rm{width:100%;min-height:44px;padding:11px;font-size:15px;font-weight:500;background:var(--red-bg);color:var(--red-text);border:0.5px solid var(--red-text);border-radius:var(--rs)}
  .rtable-resp td.m-action-rm .btn-rm:hover{background:var(--red-bg)}

  /* Add action button — full-width, prominent */
  .action-add{margin-top:12px}
  .action-add .btn{width:100%;min-height:44px;font-size:15px;font-weight:500;padding:12px}

  /* Approve panel */
  .approve-card{padding:1.25rem 1rem}
  .approve-card .btn.full{max-width:none}
  .approved-block{font-size:15px;line-height:1.5}

  /* Toast — bottom-center, full-width with safe-area */
  .toast{left:12px;right:12px;bottom:max(16px,env(safe-area-inset-bottom));padding:12px 16px;font-size:15px;text-align:center}
}

.attendance-note{font-size:12px;color:var(--text2);line-height:1.5;margin:7px 0 12px}
.attendance-mobile{margin-bottom:12px}
.attendance-edit{min-width:165px;max-width:100%}
.report-average{background:var(--blue-bg)}
.sec3-desktop{overflow-x:auto}
@media(max-width:640px){
  .attendance-mobile select{width:100%;font-size:16px;min-height:44px;padding:10px;border:1px solid var(--border2);border-radius:var(--rs);background:var(--bg);color:var(--text)}
  .m-vtot{gap:12px;align-items:flex-start}.m-vtot strong{text-align:right;font-size:15px}
}
</style>
</head>
<body>
<div class="page">

  <!-- ── Screen 1: Login ── -->
  <div id="screen-login">
    <div class="hdr">
      <h1>Reviewer access</h1>
      <p>Enter the session date and code shared by the admin</p>
    </div>
    <div class="card login-card">
      <div class="field">
        <label class="lbl" for="rev-name">Your name</label>
        <select id="rev-name" autocomplete="off" disabled>
          <option value="">— Loading reviewers… —</option>
        </select>
        <div id="rev-name-help" class="help" style="margin-top:6px;display:none"></div>
      </div>
      <div class="field">
        <label class="lbl" for="rev-date">Session date</label>
        <input type="date" id="rev-date" autocomplete="off">
      </div>
      <div class="field">
        <label class="lbl" for="rev-code">Session code</label>
        <input type="tel" id="rev-code" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="6-digit code">
      </div>
      <button class="btn pri full" id="rev-go" onclick="attemptLogin()">Continue</button>
      <div id="rev-msg" class="msg"></div>
      <div class="help">Don't have a code or session date? Ask the admin to share both with you.</div>
    </div>
  </div>

  <!-- ── Screen 2: Report ── -->
  <div id="screen-report" style="display:none">
    <div class="review-hdr">
      <div class="rh-left">
        <h2 id="rh-name">—</h2>
        <p id="rh-date">—</p>
        <p id="rh-approval" class="approval-line"></p>
      </div>
      <div class="rh-right">
        <span class="badge grey" id="rh-pill">Pending review</span>
        <span class="who">Editing as: <strong id="rh-who"></strong></span>
        <button class="btn sm" onclick="signOut()">Sign out</button>
      </div>
    </div>
    <div id="report-output">
      <div class="loading-state">Loading report…</div>
    </div>
  </div>

</div>

<script>
// ═══════════════════════════════════════════════════
// FIREBASE (anonymous — no auth token)
// ═══════════════════════════════════════════════════
const DB = "https://food-sampling-hod-iforum-default-rtdb.firebaseio.com";
async function fbGet(p){ const r=await fetch(DB+p+".json"); if(!r.ok)throw new Error("HTTP "+r.status); return r.json() }
async function fbPut(p, value){
  const r = await fetch(DB+p+".json", { method:"PUT", headers:{"Content-Type":"application/json"}, body: JSON.stringify(value) });
  if(!r.ok) throw new Error("HTTP "+r.status);
  return r.json();
}
async function fbPatch(p, body){
  const r = await fetch(DB+p+".json", { method:"PATCH", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body) });
  if(!r.ok) throw new Error("HTTP "+r.status);
  return r.json();
}

// In-memory only. Never persisted, never logged, never in URL.
let reviewerName = "";
let sessionKey = "";
let sessionData = null;

// ═══════════════════════════════════════════════════
// LOGIN
// ═══════════════════════════════════════════════════
function showLoginMsg(text, kind){
  const el = document.getElementById("rev-msg");
  el.className = "msg " + (kind||"red");
  el.textContent = text;
}

// Populate the reviewer name dropdown from /reviewers. Called on initial load
// and whenever the user returns to the login screen, so it picks up admin
// changes without a page reload.
async function loadReviewers(){
  const sel = document.getElementById("rev-name");
  const help = document.getElementById("rev-name-help");
  const goBtn = document.getElementById("rev-go");
  sel.innerHTML = '<option value="">— Loading reviewers… —</option>';
  sel.disabled = true;
  help.style.display = "none";
  help.textContent = "";
  goBtn.disabled = true;
  let data;
  try{
    data = await fbGet("/reviewers");
  }catch(e){
    sel.innerHTML = '<option value="">— Couldn\'t load reviewers —</option>';
    sel.disabled = true;
    help.innerHTML = '<a href="#" onclick="event.preventDefault();loadReviewers()">Retry</a>';
    help.style.display = "block";
    goBtn.disabled = true;
    return;
  }
  const all = data ? Object.values(data).filter(r=>r && !r.deleted && (r.name||"").trim()) : [];
  if(all.length === 0){
    sel.innerHTML = '<option value="">— No reviewers available —</option>';
    sel.disabled = true;
    help.textContent = "No reviewers set up yet — ask your admin to add you.";
    help.style.display = "block";
    goBtn.disabled = true;
    return;
  }
  all.sort((a,b)=>a.name.localeCompare(b.name));
  sel.innerHTML = '<option value="">— Select your name —</option>' +
    all.map(r=>`<option value="${escapeHtml(r.name)}">${escapeHtml(r.name)}</option>`).join("");
  sel.disabled = false;
  goBtn.disabled = false;
}

const GENERIC_LOGIN_ERR = "Invalid date or code, or this session is no longer accepting reviews. Check with your admin.";

async function attemptLogin(){
  const nameEl = document.getElementById("rev-name");
  const dateEl = document.getElementById("rev-date");
  const codeEl = document.getElementById("rev-code");
  const name = nameEl.value.trim();
  const dateVal = dateEl.value;
  const code = codeEl.value.trim();
  const btn = document.getElementById("rev-go");

  if(!name){ showLoginMsg("Please pick your name."); nameEl.focus(); return }
  if(!/^\d{4}-\d{2}-\d{2}$/.test(dateVal)){ showLoginMsg("Please pick the session date."); dateEl.focus(); return }
  if(!/^[0-9]{6}$/.test(code)){ showLoginMsg("Code must be 6 digits."); codeEl.focus(); return }

  const key = dateVal.replace(/-/g,"");
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Checking…';
  try{
    let r;
    try{
      r = await fetch(DB+"/sessions/"+key+".json");
    }catch(networkErr){
      showLoginMsg("Couldn't reach the server. Try again.","amber");
      return;
    }
    if(!r.ok){
      if(r.status === 401 || r.status === 403){
        showLoginMsg(GENERIC_LOGIN_ERR);
      } else {
        showLoginMsg("Couldn't reach the server. Try again.","amber");
      }
      return;
    }
    const session = await r.json();
    if(!session || typeof session !== "object"){
      showLoginMsg(GENERIC_LOGIN_ERR);
      return;
    }
    const now = Date.now();
    // A session is open for 48 hours from its start (same rule as the taster
    // page and the database rules). activeUntil is vestigial — never read it.
    const af = Number(session.activeFrom);
    const codeOk = session.reviewerCode === code;
    const statusOk = (session.status !== "approved");
    const windowOk = isFinite(af) && af <= now && now <= af + 172800000;
    if(!codeOk || !statusOk || !windowOk){
      showLoginMsg(GENERIC_LOGIN_ERR);
      return;
    }
    reviewerName = name;
    sessionKey = key;
    sessionData = session;
    swapToReport();
    await loadReport();
  }finally{
    btn.disabled = false; btn.textContent = "Continue";
  }
}

function swapToReport(){
  document.getElementById("rev-msg").className = "msg";
  document.getElementById("rev-msg").textContent = "";
  document.getElementById("screen-login").style.display = "none";
  document.getElementById("screen-report").style.display = "block";
  document.getElementById("rh-name").textContent = sessionData.name || sessionData.date || "Session";
  document.getElementById("rh-date").textContent = sessionData.date ? "Date: "+sessionData.date : "";
  document.getElementById("rh-who").textContent = reviewerName;
}

function signOut(){
  if(vendorSavesPending || approvalPending){ showToast("Please wait for saving to finish.","err"); return; }
  vendorSaveFailed = false;
  restoreTitle();
  reviewerName = "";
  sessionKey = "";
  sessionData = null;
  document.getElementById("rev-date").value = "";
  document.getElementById("rev-code").value = "";
  document.getElementById("rev-msg").className = "msg";
  document.getElementById("rev-msg").textContent = "";
  document.getElementById("report-output").innerHTML = '<div class="loading-state">Loading report…</div>';
  document.getElementById("screen-report").style.display = "none";
  document.getElementById("screen-login").style.display = "block";
  loadReviewers();
}

// ═══════════════════════════════════════════════════
// REPORT LOADING
// ═══════════════════════════════════════════════════
async function loadReport(){
  const out = document.getElementById("report-output");
  out.innerHTML = '<div class="loading-state">Loading report…</div>';
  if(!sessionKey){ return }
  let session;
  try{
    session = await fbGet("/sessions/"+sessionKey);
    if(!session) throw new Error("Session not found");
  }catch(e){
    showReportError();
    return;
  }
  let vendors = {}, categories = {}, loadFailed = false;
  try{
    const [vData, cData] = await Promise.all([fbGet("/vendors"), fbGet("/categories")]);
    vendors = vData || {};
    categories = cData || {};
  }catch(e){
    console.warn("Report: failed to load vendors/categories — totals will default to /35.", e);
    loadFailed = true;
  }
  sessionData = session;
  vendorSaveFailed = false;
  lastVendors = vendors; lastCategories = categories; lastLoadFailed = loadFailed;
  document.getElementById("rh-name").textContent = session.name || session.date || "Session";
  document.getElementById("rh-date").textContent = session.date ? "Date: "+session.date : "";
  updateHeader();
  out.innerHTML = buildReport(session, vendors, categories, loadFailed, true, true);
  document.title = reportTitle(session);
}

function formatApprovedAt(ms){
  const d = new Date(ms);
  if(isNaN(d.getTime())) return "";
  const mo = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return d.getDate() + " " + mo[d.getMonth()] + " " + d.getFullYear();
}

const ORIGINAL_TITLE = document.title;
function sanitizeForTitle(s){ return String(s==null?"":s).replace(/[\x00-\x1f\x7f]/g,"").trim(); }
function reportTitle(session){
  const name = sanitizeForTitle(session && session.name) || sanitizeForTitle(session && session.date) || "Inspection report";
  const date = sanitizeForTitle(session && session.date) || new Date().toISOString().slice(0,10);
  return name + " \u2014 " + date;
}
function restoreTitle(){ document.title = ORIGINAL_TITLE; }
function approvalStampHtml(session){
  if(!session || session.status !== "approved" || !session.approvedBy) return "";
  return `<div class="report-approval-stamp"><span class="approval-badge">\u2713 APPROVED</span><span>Approved by ${escapeHtml(session.approvedBy)} on ${formatApprovedAt(session.approvedAt)}</span></div>`;
}

function updateHeader(){
  const pill = document.getElementById("rh-pill");
  const line = document.getElementById("rh-approval");
  if(!pill || !line) return;
  const approved = sessionData && sessionData.status === "approved";
  pill.className = "badge " + (approved ? "green" : "grey");
  pill.textContent = approved ? "Approved" : "Pending review";
  if(approved && sessionData.approvedBy){
    const when = sessionData.approvedAt ? formatApprovedAt(sessionData.approvedAt) : "";
    line.textContent = "Approved by " + sessionData.approvedBy + (when ? " on " + when : "");
  } else {
    line.textContent = "";
  }
}

function showReportError(){
  document.getElementById("report-output").innerHTML =
    '<div class="card"><div class="err-overlay">' +
    '<h3>Couldn\u2019t load this report</h3>' +
    '<p>Something went wrong fetching the session. Check your connection and try again.</p>' +
    '<button class="btn pri" onclick="tryAgain()">Try again</button>' +
    '</div></div>';
}

async function tryAgain(){
  await loadReport();
}

// ═══════════════════════════════════════════════════
// SAVE HANDLERS (R3b) — last-write-wins, no concurrency control
// ═══════════════════════════════════════════════════
let toastTimer = null;
function showToast(text, kind){
  const old = document.getElementById("rev-toast");
  if(old) old.remove();
  if(toastTimer){ clearTimeout(toastTimer); toastTimer = null; }
  const el = document.createElement("div");
  el.id = "rev-toast";
  el.className = "toast " + (kind==="err" ? "red" : "green");
  el.textContent = text;
  document.body.appendChild(el);
  toastTimer = setTimeout(()=>{ el.remove(); toastTimer = null; }, kind==="err" ? 4000 : 1500);
}
function showSaved(){ showToast("Saved", "ok"); }
function showSaveError(){ showToast("Save failed. Refresh and try again.", "err"); }

function normalizeScore(raw){
  if(raw === "" || raw == null) return null;
  const n = parseInt(raw, 10);
  if(isNaN(n)) return raw;
  return n;
}

// Serialize vendor edits: an attendance change must finish before a later score save.
let vendorSaveQueue = Promise.resolve();
let vendorSaveFailed = false;
let vendorSavesPending = 0;
let approvalPending = false;
function queueVendorSave(work){
  if(!sessionKey || sessionData?.status === "approved" || approvalPending) return Promise.resolve();
  const key = sessionKey;
  vendorSavesPending++;
  const result = vendorSaveQueue.then(async()=>{
    if(sessionKey !== key) throw new Error("Session changed");
    await work(key);
  });
  vendorSaveQueue = result.catch(()=>{ vendorSaveFailed = true; showSaveError(); });
  return vendorSaveQueue.finally(()=>{ vendorSavesPending--; });
}
function currentVendor(subId, vendorIdx){ return sessionData?.submissions?.[subId]?.vendors?.[vendorIdx]; }
async function saveField(subId, vendorIdx, field, rawValue){
  return queueVendorSave(async key=>{
    const entry = currentVendor(subId,vendorIdx);
    if(!entry || isAbsentEntry(entry)) throw new Error("Vendor is not being assessed");
    if(FOOD_FIELDS.includes(field)){
      if(!entryFoodFields(entry).includes(field)) throw new Error("Criterion does not apply");
      if(rawValue !== "" && (!Number.isInteger(rawValue) || rawValue < 1 || rawValue > 5)) throw new Error("Invalid score");
    }
    await fbPut("/sessions/"+key+"/submissions/"+subId+"/vendors/"+vendorIdx+"/"+field, rawValue);
    entry[field] = rawValue;
    showSaved();
    if(FOOD_FIELDS.includes(field)) rerenderReport();
  });
}
async function saveScore(subId, vendorIdx, field, rawValue){
  return saveField(subId,vendorIdx,field,rawValue === "" ? "" : Number(rawValue));
}
async function saveAttendance(subId, vendorIdx, value){
  const entry = currentVendor(subId,vendorIdx);
  if(!entry || entry.assessmentVersion !== 2) return;
  return queueVendorSave(async key=>{
    const e = currentVendor(subId,vendorIdx);
    const allowed = hasAttendanceScore(e) ? ["Early","Middle","Late","Absent"] : ["Present","Absent"];
    if(!allowed.includes(value)) throw new Error("Invalid attendance");
    const patch = {att:value,attendance:hasAttendanceScore(e)?ATTENDANCE_POINTS[value]:null};
    if(value === "Absent"){
      FOOD_FIELDS.concat(["sample","cust","obs","fu","pi"]).forEach(f=>{patch[f]=null;});
    } else {
      patch.notice = null; patch.absenceReason = null;
      if(isAbsentEntry(e)) entryFoodFields(e).forEach(f=>{patch[f]="";});
    }
    // One atomic update: absence and score removal must arrive together.
    await fbPatch("/sessions/"+key+"/submissions/"+subId+"/vendors/"+vendorIdx,patch);
    Object.entries(patch).forEach(([f,v])=>{if(v===null) delete e[f]; else e[f]=v;});
    showSaved(); rerenderReport();
  });
}

async function saveAction(subId, actionIdx, field, value){
  if(!sessionKey){ return }
  const path = "/sessions/"+sessionKey+"/submissions/"+subId+"/actions/"+actionIdx+"/"+field;
  try{
    await fbPut(path, value);
    if(sessionData && sessionData.submissions && sessionData.submissions[subId] && sessionData.submissions[subId].actions && sessionData.submissions[subId].actions[actionIdx]){
      sessionData.submissions[subId].actions[actionIdx][field] = value;
    }
    showSaved();
  }catch(e){
    showSaveError();
  }
}

async function addAction(subId){
  if(!sessionKey){ return }
  const sub = sessionData && sessionData.submissions && sessionData.submissions[subId];
  if(!sub){ showSaveError(); return }
  const actions = sub.actions || [];
  const newIdx = actions.length;
  const blank = { vendor:"", issue:"", action:"", deadline:"", officer:"" };
  try{
    await fbPut("/sessions/"+sessionKey+"/submissions/"+subId+"/actions/"+newIdx, blank);
    sub.actions = actions.concat([blank]);
    showSaved();
    rerenderReport();
  }catch(e){
    showSaveError();
  }
}

async function removeAction(subId, actionIdx){
  if(!sessionKey){ return }
  if(!confirm("Remove this action item?")) return;
  const sub = sessionData && sessionData.submissions && sessionData.submissions[subId];
  if(!sub || !sub.actions){ showSaveError(); return }
  // Rewrite actions array without this index, then PUT the whole array.
  const next = sub.actions.slice(0, actionIdx).concat(sub.actions.slice(actionIdx+1));
  try{
    await fbPut("/sessions/"+sessionKey+"/submissions/"+subId+"/actions", next.length ? next : null);
    sub.actions = next;
    showSaved();
    rerenderReport();
  }catch(e){
    showSaveError();
  }
}

// ═══════════════════════════════════════════════════
// APPROVE (R5)
// ═══════════════════════════════════════════════════
const APPROVE_HELP = "When you approve, the report becomes final. Edits will be locked until an admin reopens the session.";
const APPROVE_CONFIRM = "Approve this report? You won't be able to edit it after this.";
const APPROVED_LOCKED_MSG = "This report has been approved. To make further changes, ask an admin to reopen the session.";

async function approveReport(){
  if(!sessionKey || !sessionData || approvalPending) return;
  if(document.activeElement?.blur) document.activeElement.blur();
  await vendorSaveQueue;
  if(vendorSaveFailed){ showToast("A change failed to save. Refresh the report and check it before approving.","err"); return; }
  const incomplete = Object.values(sessionData.submissions||{}).some(sub=>(sub.vendors||[]).some(e=>e.assessmentVersion===2 && !isAbsentEntry(e) && entrySummary(e).percent===null));
  if(incomplete){ showToast("Finish all scores for present vendors before approving.","err"); return; }
  if(!confirm(APPROVE_CONFIRM)) return;
  approvalPending = true;
  const btn = document.getElementById("rev-approve-btn");
  if(btn){ btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Approving…'; }
  const payload = {
    status: "approved",
    approvedBy: reviewerName,
    approvedAt: Date.now()
  };
  try{
    await fbPatch("/sessions/"+sessionKey, payload);
    sessionData.status = payload.status;
    sessionData.approvedBy = payload.approvedBy;
    sessionData.approvedAt = payload.approvedAt;
    rerenderReport();
  }catch(e){
    showToast("Approval failed. Refresh and try again.", "err");
    if(btn){ btn.disabled = false; btn.textContent = "Approve report"; }
  }finally{ approvalPending = false; }
}

function rerenderReport(){
  // Re-render from cached sessionData + last-known vendors/categories.
  // We don't re-fetch /vendors|/categories here — those are stable for a session.
  const out = document.getElementById("report-output");
  if(!sessionData) return;
  // Preserve scroll position so the in-place re-render after approve / action
  // add-or-remove doesn't jump the reviewer to the top of the page.
  const sx = window.scrollX, sy = window.scrollY;
  out.innerHTML = buildReport(sessionData, lastVendors, lastCategories, lastLoadFailed, true, true);
  updateHeader();
  window.scrollTo(sx, sy);
}

let lastVendors = {}, lastCategories = {}, lastLoadFailed = false;

// ═══════════════════════════════════════════════════
// REPORT RENDERING — adapted from admin.html with R3b edit affordances
// ═══════════════════════════════════════════════════
function escapeHtml(s){
  return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

function vendorHasPick(v){ return !!(v && (v.vendorId || v.name)); }
function vendorDisplay(v){
  if(v.vendorId) return escapeHtml(v.businessName||"") + " — " + escapeHtml(v.vendorName||"");
  return escapeHtml(v.name||"");
}
function vendorCategory(v){
  if(v.vendorId) return escapeHtml(v.categoryName||"");
  return escapeHtml(v.cat||"");
}
function vendorGroupKey(v){
  if(v.vendorId) return "id:"+v.vendorId;
  return "nm:"+(v.name||"").trim().toLowerCase();
}

// Keep these report calculations and buildReport identical in admin.html and review.html.
const FOOD_FIELDS = ["taste","aroma","appear","hygiene","environ","storage","safety"];
const ATTENDANCE_POINTS = {Early:5, Middle:3, Late:1, Absent:0};
const ATTENDANCE_LABELS = {Early:"Early and ready", Middle:"Around the expected time", Late:"Late", Absent:"Absent", Present:"Present"};
function isAbsentEntry(e){ return e.att === "Absent" || String(e.att||"").startsWith("Absent ("); }
function hasAttendanceScore(e){ return e.assessmentVersion === 2 && e.criteriaSnapshot?.attendance === true; }
function entryFoodFields(e){
  return e.assessmentVersion === 2 && e.criteriaSnapshot ? FOOD_FIELDS.filter(f=>e.criteriaSnapshot[f] === true) : FOOD_FIELDS.filter(f=>f in e);
}
function foodScore(e, f){
  if(isAbsentEntry(e) || !entryFoodFields(e).includes(f) || e[f] === "" || e[f] == null) return null;
  const n = Number(e[f]);
  return Number.isFinite(n) && n >= 1 && n <= 5 ? n : null;
}
function attendanceScore(e){
  return hasAttendanceScore(e) && Object.hasOwn(ATTENDANCE_POINTS,e.att) ? ATTENDANCE_POINTS[e.att] : null;
}
function attendanceLabel(e){
  const label = ATTENDANCE_LABELS[e.att] || e.att || "Not recorded";
  const score = attendanceScore(e);
  return label + (score === null ? "" : " · " + score + "/5");
}
function entrySummary(e){
  if(isAbsentEntry(e)) return {text:"Food assessment: Not assessed",percent:null};
  const fields = entryFoodFields(e);
  const vals = fields.map(f=>foodScore(e,f));
  if(hasAttendanceScore(e)) vals.push(attendanceScore(e));
  if(!vals.length) return {text:"Not assessed",percent:null};
  if(vals.some(v=>v === null)) return {text:"Incomplete — finish all scores",percent:null};
  const total = vals.reduce((a,b)=>a+b,0), max = vals.length*5;
  return {text:total+"/"+max+" · "+Math.round(total/max*100)+"%",percent:total/max*100};
}

function buildReport(session, vendors, categories, loadFailed, showTasterNames = true, reviewerMode = false){
  vendors = vendors || {}; categories = categories || {};
  const subEntries = Object.entries(session.submissions||{}); // [ [subId, sub], ... ]
  const subs = subEntries.map(([,s])=>s);
  const sf = ["taste","aroma","appear","hygiene","environ","storage","safety"];
  const SF_LABEL = {taste:"Taste", aroma:"Aroma", appear:"Appearance", hygiene:"Hygiene", environ:"Environment", storage:"Storage", safety:"Safety"};
  const MUTE = '<span class="rcell-mute">—</span>';
  const isApproved = session && session.status === "approved";
  const readOnly = !reviewerMode || isApproved;

  const scoreSelect = (entry, key) => {
    if(isAbsentEntry(entry) || !entryFoodFields(entry).includes(key)) return MUTE;
    const cur = entry[key] == null ? "" : String(entry[key]);
    if(readOnly) return cur === "" ? MUTE : escapeHtml(cur);
    const opts = ["","1","2","3","4","5"];
    if(cur && !opts.includes(cur)) opts.push(cur);
    return `<select aria-label="${SF_LABEL[key]}" class="cell-edit" data-sub="${escapeHtml(entry._subId)}" data-vidx="${entry._vIdx}" data-field="${key}" onchange="saveScore(this.dataset.sub, +this.dataset.vidx, this.dataset.field, this.value)">${opts.map(o=>`<option value="${escapeHtml(o)}"${o===cur?" selected":""}>${o===""?"—":escapeHtml(o)}</option>`).join("")}</select>`;
  };
  const attendanceControl = e => {
    let html = escapeHtml(attendanceLabel(e));
    if(!readOnly && e.assessmentVersion === 2){
      const opts = hasAttendanceScore(e) ? ["Early","Middle","Late","Absent"] : ["Present","Absent"];
      html = `<select aria-label="Attendance & punctuality" class="cell-edit attendance-edit" data-sub="${escapeHtml(e._subId)}" data-vidx="${e._vIdx}" onchange="saveAttendance(this.dataset.sub,+this.dataset.vidx,this.value)">${opts.map(v=>`<option value="${v}"${v===e.att?" selected":""}>${escapeHtml(ATTENDANCE_LABELS[v])}${hasAttendanceScore(e)?" · "+ATTENDANCE_POINTS[v]+"/5":""}</option>`).join("")}</select>`;
    }
    if(isAbsentEntry(e)) html += `<div class="attendance-note">Notice: ${escapeHtml(e.notice || "Not recorded")}${e.absenceReason?" · "+escapeHtml(e.absenceReason):""}</div>`;
    return html;
  };

  let h=`<div class="card">`;
  h+=`<div style="text-align:center;padding:1rem 0 1.5rem"><div style="font-size:22px;font-weight:700;margin-bottom:6px">Food Vendor Inspection Report</div><div style="font-size:14px;color:var(--text2)">${escapeHtml(session.name||session.date)} &nbsp;&middot;&nbsp; Date: ${escapeHtml(session.date||"")} &nbsp;&middot;&nbsp; ${subs.length} taster(s)</div></div>`;

  if(!reviewerMode) h+=`<div class="report-toolbar"><button class="btn sm" onclick="toggleTasterNames()">${showTasterNames?"Hide taster names":"Show taster names"}</button></div>`;
  if(loadFailed){
    h+=`<div class="report-warn">Couldn't load full category data — totals are computed from submission data only.</div>`;
  }

  h+=`<div class="sguide"><div class="sguide-t">Scoring Guide — Rate each criterion from 1 to 5</div><div class="sguide-grid"><div class="sguide-item sguide-1"><b>1</b>Unacceptable / Failed</div><div class="sguide-item sguide-2"><b>2</b>Below minimum</div><div class="sguide-item sguide-3"><b>3</b>Meets minimum</div><div class="sguide-item sguide-4"><b>4</b>Good</div><div class="sguide-item sguide-5"><b>5</b>Excellent</div></div></div>`;

  h+=`<div style="margin-bottom:1.5rem"><div class="card-t" style="font-size:13px">Tasters who submitted</div><table class="rtable rtable-resp"><thead><tr><th>#</th><th>Name</th><th>Role</th><th>Time submitted</th><th>Vendors assessed</th></tr></thead><tbody>`;
  subs.forEach((s,i)=>{ h+=`<tr><td data-label="#">${i+1}</td><td data-label="Name"><strong>${escapeHtml(s.taster||"")}</strong></td><td data-label="Role">${escapeHtml(s.role||"—")}</td><td data-label="Time submitted">${escapeHtml(s.time||"")}</td><td data-label="Vendors assessed">${(s.vendors||[]).filter(vendorHasPick).length}</td></tr>` });
  h+=`</tbody></table></div>`;

  const vmap={};
  subEntries.forEach(([subId, sub])=>{
    (sub.vendors||[]).forEach((v, vi)=>{
      if(!vendorHasPick(v)) return;
      const k = vendorGroupKey(v);
      if(!vmap[k]) vmap[k] = { display: vendorDisplay(v), cat: vendorCategory(v), entries: [] };
      vmap[k].entries.push({taster: sub.taster, _subId: subId, _vIdx: vi, ...v, _display: vendorDisplay(v)});
    });
  });

  // Absences count as zero for attendance, but never enter food-quality averages.
  const vendorList = Object.values(vmap).map(vd=>{
    const avg = {};
    sf.forEach(f=>{
      const values = vd.entries.map(e=>foodScore(e,f)).filter(n=>n !== null);
      avg[f] = values.length ? (values.reduce((a,b)=>a+b,0)/values.length).toFixed(1) : null;
    });
    const attendanceValues = vd.entries.map(attendanceScore).filter(n=>n !== null);
    const attendanceAvg = attendanceValues.length ? (attendanceValues.reduce((a,b)=>a+b,0)/attendanceValues.length).toFixed(1)+"/5" : "—";
    const percentages = vd.entries.map(e=>entrySummary(e).percent).filter(n=>n !== null);
    const avgCell = percentages.length ? Math.round(percentages.reduce((a,b)=>a+b,0)/percentages.length)+"% (assessed entries)" : "Not assessed";
    const absentCount = vd.entries.filter(isAbsentEntry).length;
    return {vd,avg,attendanceAvg,avgCell,absentCount};
  });

  h+=`<div style="margin-bottom:1.5rem"><div class="card-t" style="font-size:13px">Section 3 — Vendor assessment</div><p class="attendance-note">Attendance, when enabled: early and ready 5 · around the expected time 3 · late 1 · absent 0. Choosing Absent clears food scores and feedback. Food averages exclude absences. Overall averages use completed assessments only.</p>`;
  h+=`<div class="sec3-desktop"><table class="rtable"><thead><tr><th>Vendor</th><th>Cat.</th>${showTasterNames?"<th>Taster</th>":""}<th>Attendance</th>${sf.map(f=>`<th>${SF_LABEL[f]}</th>`).join("")}<th>Total</th></tr></thead><tbody>`;
  vendorList.forEach(({vd,avg,attendanceAvg,avgCell,absentCount},vi)=>{
    vd.entries.forEach((e,ei)=>{
      h+=`<tr>`;
      if(ei===0) h+=`<td rowspan="${vd.entries.length+1}"><strong>${vi+1}. ${vd.display}</strong></td><td rowspan="${vd.entries.length+1}">${vd.cat||"—"}</td>`;
      if(showTasterNames) h+=`<td>${escapeHtml(e.taster||"")}</td>`;
      h+=`<td>${attendanceControl(e)}</td>${sf.map(f=>`<td>${scoreSelect(e,f)}</td>`).join("")}<td>${entrySummary(e).text}</td></tr>`;
    });
    h+=`<tr class="report-average">${showTasterNames?"<td>Average</td>":""}<td>Attendance: ${attendanceAvg}<br>${absentCount} absent</td>${sf.map(f=>`<td><strong>${avg[f]===null?MUTE:avg[f]}</strong></td>`).join("")}<td><strong>${avgCell}</strong></td></tr>`;
  });
  h+=`</tbody></table></div><div class="sec3-mobile">`;
  vendorList.forEach(({vd,avg,attendanceAvg,avgCell,absentCount},vi)=>{
    vd.entries.forEach(e=>{
      const rows = isAbsentEntry(e) ? "" : entryFoodFields(e).map(f=>`<div class="m-row"><span class="m-lbl">${SF_LABEL[f]}</span><span class="m-val">${scoreSelect(e,f)}</span></div>`).join("");
      h+=`<div class="m-vcard"><div class="m-vhead"><div class="m-vname">${vi+1}. ${vd.display}</div><div class="m-vsub">${vd.cat||"—"}</div></div>
        ${showTasterNames?`<div class="m-vmeta">Taster: <strong>${escapeHtml(e.taster||"—")}</strong></div>`:""}
        <div class="attendance-mobile"><span class="lbl">Attendance &amp; punctuality</span>${attendanceControl(e)}</div>
        <div class="m-rows">${rows}</div><div class="m-vtot"><span>Total</span><strong>${entrySummary(e).text}</strong></div></div>`;
    });
    if(vd.entries.length >= 2){
      h+=`<div class="m-vcard m-avg"><div class="m-vhead"><div class="m-vname">${vi+1}. ${vd.display}</div><div class="m-vsub">Average · ${absentCount} absent</div></div>
        <div class="m-row"><span class="m-lbl">Attendance</span><span class="m-val"><strong>${attendanceAvg}</strong></span></div>
        ${sf.filter(f=>avg[f]!==null).map(f=>`<div class="m-row"><span class="m-lbl">${SF_LABEL[f]}</span><span class="m-val"><strong>${avg[f]}</strong></span></div>`).join("")}
        <div class="m-vtot"><span>Overall</span><strong>${avgCell}</strong></div></div>`;
    }
  });
  h+=`</div></div>`;

  // Section 4 — feedback (text inputs + radio groups; plain text when approved)
  const fbText = (e, field) => {
    if(isAbsentEntry(e)) return MUTE;
    const cur = e[field] == null ? "" : String(e[field]);
    if(readOnly) return cur === "" ? MUTE : escapeHtml(cur);
    return `<input type="text" class="cell-edit" data-sub="${escapeHtml(e._subId)}" data-vidx="${e._vIdx}" data-field="${field}" value="${escapeHtml(cur)}" onblur="if(this.value!==this.defaultValue){saveField(this.dataset.sub, +this.dataset.vidx, this.dataset.field, this.value); this.defaultValue=this.value}">`;
  };
  const fbRadio = (e, field, options) => {
    if(isAbsentEntry(e)) return MUTE;
    const cur = e[field] == null ? "" : String(e[field]);
    if(readOnly) return cur === "" ? MUTE : escapeHtml(cur);
    const grpName = `r-${e._subId}-${e._vIdx}-${field}`;
    return `<div class="radio-grp">` + options.map(o=>`<label><input type="radio" name="${grpName}" value="${escapeHtml(o)}"${o===cur?" checked":""} onchange="saveField('${e._subId}', ${e._vIdx}, '${field}', this.value)">${escapeHtml(o)}</label>`).join("") + `</div>`;
  };
  h+=`<div style="margin-bottom:1.5rem"><div class="card-t" style="font-size:13px">Section 4 — Feedback &amp; observations</div><table class="rtable rtable-resp"><thead><tr><th>Vendor</th>${showTasterNames?"<th>Taster</th>":""}<th>Sampled product</th><th>Customer feedback</th><th>Observations</th><th>Follow-up?</th><th>Prev. resolved?</th></tr></thead><tbody>`;
  Object.values(vmap).forEach(vd=>{
    vd.entries.forEach(e=>{
      h+=`<tr><td data-label="Vendor"><strong>${e._display}</strong></td>${showTasterNames?`<td data-label="Taster">${escapeHtml(e.taster||"")}</td>`:""}`;
      h+=`<td data-label="Sampled product">${fbText(e,"sample")}</td><td data-label="Customer feedback">${fbText(e,"cust")}</td><td data-label="Observations">${fbText(e,"obs")}</td>`;
      h+=`<td data-label="Follow-up?">${fbRadio(e,"fu",["Yes","No"])}</td>`;
      h+=`<td data-label="Prev. resolved?">${fbRadio(e,"pi",["Yes","No","N/A"])}</td>`;
      h+=`</tr>`;
    });
  });
  h+=`</tbody></table></div>`;

  // Section 5 — actions, rebuilt by (subId, actionIdx) to preserve source order.
  // No filtering on a.issue — empty rows still render so the reviewer can fill them.
  const allA=[];
  subEntries.forEach(([subId, sub])=>{
    (sub.actions||[]).forEach((a, aIdx)=>{
      allA.push({_subId: subId, _aIdx: aIdx, taster: sub.taster, ...a});
    });
  });
  // Add target: first submission's actions array (reviewer-added items get
  // attributed to that submitter). If no submissions exist, no Add button.
  const addSubId = subEntries.length ? subEntries[0][0] : null;

  const aText = (a, field) => {
    const cur = a[field] == null ? "" : String(a[field]);
    if(readOnly) return cur === "" ? MUTE : escapeHtml(cur);
    return `<input type="text" class="cell-edit" value="${escapeHtml(cur)}" onblur="if(this.value!==this.defaultValue){saveAction('${a._subId}', ${a._aIdx}, '${field}', this.value); this.defaultValue=this.value}">`;
  };
  const aDate = (a, field) => {
    const cur = a[field] == null ? "" : String(a[field]);
    if(readOnly) return cur === "" ? MUTE : escapeHtml(cur);
    return `<input type="date" class="cell-edit" value="${escapeHtml(cur)}" onchange="saveAction('${a._subId}', ${a._aIdx}, '${field}', this.value)">`;
  };

  h+=`<div style="margin-bottom:1.5rem"><div class="card-t" style="font-size:13px">Section 5 — Actions &amp; follow-ups</div>`;
  if(allA.length){
    const headExtra = readOnly ? "" : "<th></th>";
    h+=`<table class="rtable rtable-resp"><thead><tr><th>#</th><th>Vendor</th><th>Raised by</th><th>Issue</th><th>Action</th><th>Deadline</th><th>Officer</th>${headExtra}</tr></thead><tbody>`;
    allA.forEach((a,i)=>{
      const hdrText = (a.vendor||"").trim() || "New action";
      h+=`<tr>`;
      h+=`<td class="m-card-hdr">${escapeHtml(hdrText)}</td>`;
      h+=`<td data-label="#" class="m-hide">${i+1}</td>`;
      h+=`<td data-label="Vendor">${aText(a,"vendor")}</td>`;
      h+=`<td data-label="Raised by">${escapeHtml(a.taster||"")}</td>`;
      h+=`<td data-label="Issue">${aText(a,"issue")}</td>`;
      h+=`<td data-label="Action">${aText(a,"action")}</td>`;
      h+=`<td data-label="Deadline">${aDate(a,"deadline")}</td>`;
      h+=`<td data-label="Officer">${aText(a,"officer")}</td>`;
      if(!readOnly){
        h+=`<td class="m-action-rm"><button class="btn-rm" onclick="removeAction('${a._subId}', ${a._aIdx})">Remove</button></td>`;
      }
      h+=`</tr>`;
    });
    h+=`</tbody></table>`;
  } else {
    h+=`<div style="font-size:13px;color:var(--text3);padding:8px 0">No action items.</div>`;
  }
  if(addSubId && !readOnly){
    h+=`<div class="action-add"><button class="btn sm" onclick="addAction('${addSubId}')">+ Add action</button></div>`;
  }
  h+=`</div>`;

  // R8 — approval stamp (only when status === "approved" + approvedBy populated)
  h+=approvalStampHtml(session);

  h+=`<div><div class="card-t" style="font-size:13px">Section 6 — Sign-off</div><table class="rtable rtable-resp"><thead><tr><th>Inspector</th><th>Role</th><th>Time submitted</th></tr></thead><tbody>`;
  subs.forEach(s=>{ h+=`<tr><td data-label="Inspector"><strong>${escapeHtml(s.taster||"")}</strong></td><td data-label="Role">${escapeHtml(s.role||"—")}</td><td data-label="Time submitted">${escapeHtml(s.time||"")}</td></tr>` });
  h+=`</tbody></table></div></div>`;

  // Reviewer-only approval controls; the same renderer serves the admin report.
  if(reviewerMode){
    h+=`<div class="approve-card">`;
    if(isApproved) h+=`<div class="approved-block">${escapeHtml(APPROVED_LOCKED_MSG)}</div>`;
    else h+=`<p class="approve-help">${escapeHtml(APPROVE_HELP)}</p><button class="btn pri full" id="rev-approve-btn" onclick="approveReport()">Approve report</button>`;
    h+=`</div>`;
  }
  return h;
}

// Submit on Enter from any input
document.getElementById("rev-name").addEventListener("keydown", e=>{ if(e.key==="Enter") attemptLogin() });
document.getElementById("rev-date").addEventListener("keydown", e=>{ if(e.key==="Enter") attemptLogin() });
document.getElementById("rev-code").addEventListener("keydown", e=>{ if(e.key==="Enter") attemptLogin() });
// Strip non-digits from the code field as the user types
document.getElementById("rev-code").addEventListener("input", e=>{ e.target.value = e.target.value.replace(/\D/g,"").slice(0,6) });

// Initial reviewer dropdown population
loadReviewers();
</script>
</body>
</html>
